[server]
bind = "127.0.0.1"
port = 6379
io_threads = 1
max_connections = 1024
idle_timeout_seconds = 300

[protocol]
max_request_bytes = 1048576
max_bulk_string_bytes = 1048576
max_array_elements = 1024
max_nesting_depth = 8

[storage]
shard_count = 16
max_memory_mb = 256
eviction_policy = "noeviction"

[aof]
enabled = false
path = "data/cachelite.aof"
fsync = "everysec"

[mysql]
enabled = false
host = "127.0.0.1"
port = 3306
database = "cachelite"
user_env = "CACHELITE_MYSQL_USER"
password_env = "CACHELITE_MYSQL_PASSWORD"
pool_size = 4
query_timeout_ms = 500
queue_capacity = 256

